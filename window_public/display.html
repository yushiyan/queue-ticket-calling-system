<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>大厅叫号展示屏</title><link rel="stylesheet" href="/assets/style.css"><script src="/assets/settings-schema.js" defer></script><script src="/assets/common.js" defer></script><script src="/assets/display.js" defer></script></head>
<body class="display-body" data-page-title="大厅叫号展示屏"><main class="hall">
<header class="hall-header"><div class="hall-identity"><span id="brand-icon" class="hall-mark" aria-hidden="true">序</span><div><div class="hall-eyebrow" data-slogan>欢迎光临 · 便民服务</div><h1 data-center>业务办理中心</h1></div></div><div id="hall-clock" class="hall-clock"><strong id="clock">--:--:--</strong><span id="date"></span></div></header>
<div class="hall-layout"><section class="hall-main"><div class="latest-call"><div class="hall-section-label"><span class="live-dot"></span><span id="latest-label">最新呼叫</span></div><div class="call-destination"><div><div id="number-caption" class="hall-caption">请以下号码前往办理</div><div id="latest-number" class="hero-number">—</div></div><div class="destination-arrow" aria-hidden="true">→</div><div><div class="hall-caption">前往窗口</div><div class="hero-window"><strong id="latest-window">—</strong><span>号窗口</span></div></div></div><div class="hall-call-hint" id="call-hint">请留意语音广播，有序前往窗口办理</div></div><section class="hall-windows"><div class="section-heading"><h2>窗口服务动态</h2><span>正在办理</span></div><div class="screen-grid" id="windows"></div></section></section>
<aside class="hall-sidebar"><section id="waiting-panel" class="waiting-panel"><div class="hall-section-label">当前等候</div><div class="waiting-value"><strong id="wait">—</strong><span>人</span></div><p>请保管好取号凭条，耐心等候</p><div id="completed-line" class="completed-line"><span>本轮已服务</span><strong><span id="completed">—</span> 人</strong></div></section><section id="recent-panel" class="recent-panel"><div class="section-heading"><h2>最近叫号</h2><span>号码 / 窗口</span></div><div id="recent" class="recent-list"></div></section></aside></div>
<footer class="hall-footer"><span class="footer-tag">温馨提示</span><span id="notice">文明排队，有序办理。请留意您的号码，提前做好准备。</span><span class="hall-network" id="network">● 服务正常</span></footer>
</main></body></html>
